<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVC Voice Changer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
    --accent: #e94560; --accent2: #533483; --text: #eaeaea;
    --text-dim: #8892a4; --green: #4caf50; --yellow: #ffc107;
    --border: rgba(255,255,255,0.08); --radius: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI','Noto Sans JP',sans-serif; font-size: 13px; min-height: 100vh; padding: 16px; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  h1 span.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-dim); display: inline-block; transition: background 0.3s; }
  h1 span.dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .stats-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; display: flex; gap: 20px; margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
  .stats-bar .stat { display: flex; flex-direction: column; gap: 2px; }
  .stats-bar .stat-val { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stats-bar .stat-val.ok { color: var(--green); }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .panel-title { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 500; }
  select, input[type="text"], input[type="number"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); padding: 6px 10px; font-size: 13px; outline: none; transition: border-color 0.2s; }
  select:focus, input:focus { border-color: var(--accent2); }
  .slider-row { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: center; }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 4px; cursor: pointer; }
  input[type="number"] { padding: 4px 6px; font-size: 12px; text-align: center; }
  .radio-group { display: flex; gap: 12px; }
  .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; color: var(--text); }
  input[type="radio"] { accent-color: var(--accent); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row label { font-size: 13px; color: var(--text); cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
  .btn { padding: 8px 18px; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; }
  .btn-start { background: var(--green); color: #fff; }
  .btn-start:hover { background: #43a047; }
  .btn-stop { background: var(--accent); color: #fff; }
  .btn-stop:hover { background: #c0392b; }
  .btn-sm { padding: 5px 12px; font-size: 12px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-sm:hover { background: var(--accent2); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  /* モデルカード */
  .model-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
  .model-card img { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .model-placeholder { width: 64px; height: 64px; border-radius: 6px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
  .model-info { flex: 1; min-width: 0; }
  .model-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .model-sr { font-size: 11px; color: var(--text-dim); }
  .model-sr span { color: var(--yellow); font-weight: 600; }
  /* モニタートグル */
  .monitor-toggle { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .toggle-switch { position: relative; width: 40px; height: 20px; }
  .toggle-switch input { display: none; }
  .toggle-slider { position: absolute; inset: 0; background: #444; border-radius: 20px; cursor: pointer; transition: background 0.3s; }
  .toggle-slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform 0.3s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--green); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
  .monitor-auto-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
  .section { margin-bottom: 16px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .error-msg { background: rgba(233,69,96,0.15); border: 1px solid var(--accent); border-radius: 5px; padding: 8px 12px; color: var(--accent); font-size: 12px; display: none; margin-top: 10px; }
  .upload-img-btn { font-size: 11px; color: var(--text-dim); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 2px 0; margin-top: 4px; display: block; }
  .upload-img-btn:hover { color: var(--text); }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1><span class="dot" id="status-dot"></span>RVC VOICE CHANGER</h1>
<div class="stats-bar">
  <div class="stat"><span class="stat-val" id="stat-latency">0</span><span>LATENCY (ms)</span></div>
  <div class="stat"><span class="stat-val ok" id="stat-inference">0</span><span>INFERENCE (ms)</span></div>
  <div class="stat"><span class="stat-val" id="stat-sola">0</span><span>SOLA OFFSET</span></div>
</div>
<div class="grid">
  <div>
    <div class="panel">
      <div class="panel-title">モデル</div>
      <div class="model-card">
        <div class="model-placeholder" id="model-placeholder">🎤</div>
        <img id="model-img" style="display:none" src="" alt="model">
        <div class="model-info">
          <div class="model-name" id="model-name">モデル未選択</div>
          <div class="model-sr">サンプルレート: <span id="model-sr-val">-</span> Hz</div>
        </div>
      </div>
      <div class="form-group">
        <label>音声モデル (.pth)</label>
        <select id="pth_path" onchange="onModelChange()"></select>
        <input type="file" id="model-img-upload" accept="image/png" style="display:none" onchange="uploadModelImage()">
        <button class="upload-img-btn" onclick="document.getElementById('model-img-upload').click()">🖼 モデル画像を設定 (.pngと同名ファイル)</button>
      </div>
      <div class="form-group">
        <label>インデックス (.index)</label>
        <select id="index_path"></select>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" onclick="refreshModels()">🔄 更新</button>
        <button class="btn btn-sm" onclick="savePreset()">💾 プリセット保存</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">オーディオデバイス</div>
      <div class="form-group"><label>ホストAPI</label><select id="sg_hostapi" onchange="refreshDevices()"></select></div>
      <div class="form-group"><label>入力デバイス</label><select id="sg_input_device"></select></div>
      <div class="form-group"><label>出力デバイス</label><select id="sg_output_device"></select></div>
      <div class="form-group">
        <label>サンプルレート</label>
        <div class="radio-group">
          <label><input type="radio" name="sr_type" value="sr_model" checked> モデル</label>
          <label><input type="radio" name="sr_type" value="sr_device"> デバイス</label>
        </div>
      </div>
      <div class="monitor-toggle">
        <label class="toggle-switch"><input type="checkbox" id="monitor_toggle" onchange="toggleMonitor()"><span class="toggle-slider"></span></label>
        <label for="monitor_toggle" style="font-size:13px">モニター有効</label>
      </div>
      <div class="monitor-auto-row">
        <input type="checkbox" id="auto_monitor" checked style="width:12px;height:12px;accent-color:var(--accent)">
        <label for="auto_monitor">変換開始時に自動有効</label>
      </div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="panel-title">一般設定</div>
      <div class="section">
        <div class="form-group"><label>音程設定 (半音)</label><div class="slider-row"><input type="range" id="pitch" min="-16" max="16" step="1" value="12" oninput="syncInput('pitch')"><input type="number" id="pitch_input" min="-16" max="16" step="1" value="12" oninput="syncSlider('pitch')"></div></div>
        <div class="form-group"><label>性別係数 / 声質の太さ</label><div class="slider-row"><input type="range" id="formant" min="-2" max="2" step="0.05" value="0" oninput="syncInput('formant')"><input type="number" id="formant_input" min="-2" max="2" step="0.05" value="0" oninput="syncSlider('formant')"></div></div>
        <div class="form-group"><label>反応閾値 (dB)</label><div class="slider-row"><input type="range" id="threhold" min="-60" max="0" step="1" value="-60" oninput="syncInput('threhold')"><input type="number" id="threhold_input" min="-60" max="0" step="1" value="-60" oninput="syncSlider('threhold')"></div></div>
        <div class="form-group"><label>Index Rate</label><div class="slider-row"><input type="range" id="index_rate" min="0" max="1" step="0.01" value="0.4" oninput="syncInput('index_rate')"><input type="number" id="index_rate_input" min="0" max="1" step="0.01" value="0.4" oninput="syncSlider('index_rate')"></div></div>
        <div class="form-group"><label>ラウドネス係数</label><div class="slider-row"><input type="range" id="rms_mix_rate" min="0" max="1" step="0.01" value="0.4" oninput="syncInput('rms_mix_rate')"><input type="number" id="rms_mix_rate_input" min="0" max="1" step="0.01" value="0.4" oninput="syncSlider('rms_mix_rate')"></div></div>
        <div class="form-group"><label>ピッチ方式</label><div class="radio-group"><label><input type="radio" name="f0method" value="pm"> pm</label><label><input type="radio" name="f0method" value="rmvpe" checked> rmvpe</label><label><input type="radio" name="f0method" value="fcpe"> fcpe</label></div></div>
        <div class="checkbox-row"><input type="checkbox" id="I_noise_reduce"><label for="I_noise_reduce">入力ノイズの低減</label></div>
        <div class="checkbox-row"><input type="checkbox" id="O_noise_reduce"><label for="O_noise_reduce">出力ノイズの低減</label></div>
      </div>
      <hr class="divider">
      <div class="panel-title">パフォーマンス設定</div>
      <div class="section">
        <div class="form-group"><label>サンプル長 (s)</label><div class="slider-row"><input type="range" id="block_time" min="0.02" max="1.5" step="0.01" value="0.13" oninput="syncInput('block_time')"><input type="number" id="block_time_input" min="0.02" max="1.5" step="0.01" value="0.13" oninput="syncSlider('block_time')"></div></div>
        <div class="form-group"><label>フェードイン/アウト長 (s)</label><div class="slider-row"><input type="range" id="crossfade_length" min="0.01" max="0.15" step="0.01" value="0.08" oninput="syncInput('crossfade_length')"><input type="number" id="crossfade_length_input" min="0.01" max="0.15" step="0.01" value="0.08" oninput="syncSlider('crossfade_length')"></div></div>
        <div class="form-group"><label>追加推論時間 (s)</label><div class="slider-row"><input type="range" id="extra_time" min="0.05" max="5.0" step="0.01" value="2.0" oninput="syncInput('extra_time')"><input type="number" id="extra_time_input" min="0.05" max="5.0" step="0.01" value="2.0" oninput="syncSlider('extra_time')"></div></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-start" id="btn-start" onclick="startVC()">▶ 音声変換を開始</button>
        <button class="btn btn-stop" id="btn-stop" onclick="stopVC()" disabled>■ 停止</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>
</div>
<script>
const socket = io();
let isRunning = false;
const LINE1_SINK = "alsa_output.usb-ARTURIA_MiniFuse_1_8831400925390353-00.HiFi__Line1__sink";

socket.on("stats", (d) => {
  document.getElementById("stat-latency").textContent = d.latency;
  document.getElementById("stat-inference").textContent = d.inference_time;
  document.getElementById("stat-sola").textContent = d.sola_offset;
});
socket.on("status", (d) => {
  setRunning(d.running);
  if (d.running && d.auto_monitor) {
    setTimeout(() => { document.getElementById("monitor_toggle").checked = true; callMonitor("enable"); }, 2000);
  }
  if (!d.running) { document.getElementById("monitor_toggle").checked = false; callMonitor("disable"); }
});
socket.on("error", (d) => showError(d.message));

function syncInput(key) {
  const s = document.getElementById(key), i = document.getElementById(key+"_input");
  i.value = s.value;
  if (isRunning && ["pitch","formant","index_rate","threhold","rms_mix_rate"].includes(key))
    socket.emit("update_param", {key, value: s.value});
}
function syncSlider(key) {
  const i = document.getElementById(key+"_input"), s = document.getElementById(key);
  const v = parseFloat(i.value);
  if (!isNaN(v) && v >= parseFloat(s.min) && v <= parseFloat(s.max)) {
    s.value = v;
    if (isRunning && ["pitch","formant","index_rate","threhold","rms_mix_rate"].includes(key))
      socket.emit("update_param", {key, value: v});
  }
}

function callMonitor(action) { fetch(`/api/monitor?action=${action}&sink=${encodeURIComponent(LINE1_SINK)}`).catch(()=>{}); }
function toggleMonitor() { callMonitor(document.getElementById("monitor_toggle").checked ? "enable" : "disable"); }

async function refreshDevices() {
  const h = document.getElementById("sg_hostapi").value;
  const d = await fetch(`/api/devices?hostapi=${encodeURIComponent(h)}`).then(r=>r.json());
  fillSelect("sg_hostapi", d.hostapis, h);
  fillSelect("sg_input_device", d.input_devices);
  fillSelect("sg_output_device", d.output_devices);
}

async function refreshModels() {
  const d = await fetch("/api/models").then(r=>r.json());
  const cur = document.getElementById("pth_path").value;
  fillSelect("pth_path", d.models.map(m=>`assets/weights/${m}`), cur);
  fillSelect("index_path", [""].concat(d.indices.map(i=>`assets/indices/${i}`)));
  await updateModelCard();
}

function fillSelect(id, opts, sel=null) {
  const el = document.getElementById(id);
  const prev = sel || el.value;
  el.innerHTML = opts.map(o=>`<option value="${o}"${o===prev?" selected":""}>${o.split("/").pop()}</option>`).join("");
}

async function updateModelCard() {
  const pth = document.getElementById("pth_path").value;
  if (!pth) return;
  const name = pth.split("/").pop().replace(".pth","");
  document.getElementById("model-name").textContent = name;
  try {
    const info = await fetch(`/api/model_info?pth=${encodeURIComponent(pth)}`).then(r=>r.json());
    document.getElementById("model-sr-val").textContent = info.samplerate || "-";
    const img = document.getElementById("model-img");
    const ph = document.getElementById("model-placeholder");
    if (info.has_image) {
      img.src = `/api/model_image?pth=${encodeURIComponent(pth)}&t=${Date.now()}`;
      img.style.display = "block"; ph.style.display = "none";
    } else { img.style.display = "none"; ph.style.display = "flex"; }
  } catch(e) {}
}

async function onModelChange() {
  await updateModelCard();
  const pth = document.getElementById("pth_path").value;
  const name = pth.split("/").pop().replace(".pth","");
  const preset = await fetch(`/api/preset/${name}`).then(r=>r.json());
  if (preset && Object.keys(preset).length > 0) applyPreset(preset);
}

function applyPreset(p) {
  ["pitch","formant","index_rate","rms_mix_rate","threhold","block_time","crossfade_length","extra_time"].forEach(k=>{
    const el = document.getElementById(k), inp = document.getElementById(k+"_input");
    if (el && p[k]!==undefined) el.value = p[k];
    if (inp && p[k]!==undefined) inp.value = p[k];
  });
  if (p.index_path) { const s = document.getElementById("index_path"); if([...s.options].some(o=>o.value===p.index_path)) s.value=p.index_path; }
  if (p.f0method) { const r = document.querySelector(`input[name="f0method"][value="${p.f0method}"]`); if(r) r.checked=true; }
}

async function savePreset() {
  const pth = document.getElementById("pth_path").value;
  const name = pth.split("/").pop().replace(".pth","");
  await fetch(`/api/preset/${name}`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(getValues())});
  alert(`プリセット保存完了: ${name}`);
}

async function uploadModelImage() {
  const file = document.getElementById("model-img-upload").files[0];
  if (!file) return;
  const pth = document.getElementById("pth_path").value;
  const fd = new FormData(); fd.append("image", file); fd.append("pth", pth);
  await fetch("/api/model_image_upload", {method:"POST",body:fd});
  await updateModelCard();
}

function getValues() {
  return {
    pth_path: document.getElementById("pth_path").value,
    index_path: document.getElementById("index_path").value,
    sg_hostapi: document.getElementById("sg_hostapi").value,
    sg_input_device: document.getElementById("sg_input_device").value,
    sg_output_device: document.getElementById("sg_output_device").value,
    sr_type: document.querySelector('input[name="sr_type"]:checked').value,
    pitch: document.getElementById("pitch").value,
    formant: document.getElementById("formant").value,
    threhold: document.getElementById("threhold").value,
    index_rate: document.getElementById("index_rate").value,
    rms_mix_rate: document.getElementById("rms_mix_rate").value,
    block_time: document.getElementById("block_time").value,
    crossfade_length: document.getElementById("crossfade_length").value,
    extra_time: document.getElementById("extra_time").value,
    f0method: document.querySelector('input[name="f0method"]:checked').value,
    I_noise_reduce: document.getElementById("I_noise_reduce").checked,
    O_noise_reduce: document.getElementById("O_noise_reduce").checked,
    auto_monitor: document.getElementById("auto_monitor").checked,
  };
}

function startVC() { hideError(); socket.emit("start", getValues()); }
function stopVC() { socket.emit("stop"); }
function setRunning(r) {
  isRunning = r;
  document.getElementById("btn-start").disabled = r;
  document.getElementById("btn-stop").disabled = !r;
  document.getElementById("status-dot").classList.toggle("active", r);
}
function showError(msg) { const e=document.getElementById("error-msg"); e.textContent=msg; e.style.display="block"; }
function hideError() { document.getElementById("error-msg").style.display="none"; }

async function init() {
  const d = await fetch("/api/devices").then(r=>r.json());
  fillSelect("sg_hostapi", d.hostapis);
  fillSelect("sg_input_device", d.input_devices);
  fillSelect("sg_output_device", d.output_devices);
  await refreshModels();
  const config = await fetch("/api/config").then(r=>r.json());
  if (config && Object.keys(config).length > 0) {
    if (config.pth_path) { document.getElementById("pth_path").value=config.pth_path; await updateModelCard(); }
    if (config.index_path) document.getElementById("index_path").value=config.index_path;
    ["sg_input_device","sg_output_device"].forEach(k=>{ if(config[k]){const s=document.getElementById(k);if([...s.options].some(o=>o.value===config[k]))s.value=config[k];}});
    if (config.sr_type) { const r=document.querySelector(`input[name="sr_type"][value="${config.sr_type}"]`); if(r)r.checked=true; }
    ["pitch","formant","threhold","index_rate","rms_mix_rate","block_time","crossfade_length","extra_time"].forEach(k=>{
      const v=config[k]; if(v!==undefined){const e=document.getElementById(k),i=document.getElementById(k+"_input");if(e)e.value=v;if(i)i.value=v;}
    });
    if (config.f0method) { const r=document.querySelector(`input[name="f0method"][value="${config.f0method}"]`); if(r)r.checked=true; }
  }
}
init();
</script>
</body>
</html>
